plugins { id 'com.android.application' }

def props = new Properties()
def signing = rootProject.file('signing.properties')
if (signing.exists()) signing.withInputStream { props.load(it) }

android {
    namespace 'com.praveen.echomusic.tv'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.praveen.echomusic.tv'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(project.findProperty('echoVersionCode') ?: '1')
        versionName project.findProperty('echoVersionName') ?: '0.0.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '' ; arguments '-DANDROID_STL=c++_shared' } }
    }

    signingConfigs {
        release {
            if (signing.exists()) {
                storeFile rootProject.file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    sourceSets { main { jniLibs.srcDirs = ['libnode/bin/'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // The bundled web app and server are plain files the app copies out on first launch.
    androidResources { noCompress += ['mjs', 'js', 'css', 'html', 'json', 'woff2', 'png', 'svg'] }
}
