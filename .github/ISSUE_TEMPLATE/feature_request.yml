name: Feature request
description: Suggest an idea for Resona
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to do, or what's missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Resona help?
      description: Your idea for how it could work.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Examples from other apps, mockups, screenshots.
