name: Bug report
description: Something in Resona isn't working right
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Resona version
      description: Settings → App updates
      placeholder: "0.3.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Web (browser)]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
